name: CI

# Lancé sur chaque PR et à chaque merge sur main. Ce workflow ne publie rien.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # La CI ne lance pas Electron : inutile de télécharger son binaire.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
